[client]
# Hide the developer toolbar and never show tracebacks to visitors.
toolbarMode = "viewer"
showErrorDetails = "none"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#4FB3E8"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2B"
textColor = "#E6E8EB"
